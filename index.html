<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f3ee"><meta name="description" content="A little balance for your family's screen time."><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./styles.css"><title>Screen Timers · Family time, in balance</title></head><body><div id="app"><div class="boot">Screen Timers<span>Opening your family space…</span></div></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><script>
(function(){
 var root=document.getElementById('app'),failed=false;
 function loading(){return !!root.querySelector('.boot');}
 function fail(message){if(failed||!loading())return;failed=true;root.innerHTML='';var box=document.createElement('div');box.className='boot boot-error';var title=document.createElement('h1');title.textContent='Let’s get your family space open.';var text=document.createElement('p');text.textContent=message;var help=document.createElement('p');help.textContent='Open the app using its GitHub Pages website address. If you just updated it, upload all the new files together.';var button=document.createElement('button');button.className='btn primary';button.textContent='Reload app';button.onclick=function(){location.reload();};box.append(title,text,help,button);root.appendChild(box);}
 window.addEventListener('error',function(event){if(event.target&&event.target.tagName==='SCRIPT')fail('The app script could not load. Make sure app-bundle.js is uploaded beside index.html.');else if(event.message)fail('Startup failed: '+event.message);},true);
 window.addEventListener('unhandledrejection',function(event){fail('Startup failed: '+(event.reason&&event.reason.message||'Your browser could not initialize sign-in.'));});
 setTimeout(function(){fail('Sign-in is taking longer than expected. Check your connection and reload.');},15000);
 if(location.protocol!=='http:'&&location.protocol!=='https:')fail('This is a downloaded app file. It needs to be opened from your published website to sign in and sync.');
})();
</script><script defer src="./app-bundle.js?v=1.3.0"></script><noscript>Enable JavaScript to use Screen Timers.</noscript></body></html>
